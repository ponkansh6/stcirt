name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 連続 push でジョブが積み上がるのを防ぐ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静的解析。CI では production schema drift を検査せず、blocking check はローカル pre-push Phase 3 で実行する。
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check:fast
      - run: pnpm lint:fast
      - run: pnpm format:check
      - run: bash scripts/check-spec-refs.sh
      - run: pnpm security-check
  # 素の `vitest run` は coverage 版と同一内容なので実行しない（-21s）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: node scripts/check-coverage-tiers.mjs
      - run: node scripts/check-coverage-completeness.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  build-e2e:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:/tmp/stcirt-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
        env:
          NEXT_BUILD: "1"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # E2E は現状ローカルの pre-push でしか走っていない。
      # 環境非依存の最終防衛線として CI にも置く。
      - name: Install Japanese CJK fonts for presentation E2E
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - run: pnpm test:e2e:push
