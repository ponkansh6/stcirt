schema: spec-driven

# Project context — shown to AI when creating artifacts
context: |
  ## 技術スタック
  - Framework: Next.js 16 (App Router, Turbopack)
  - Language: TypeScript (strict mode)
  - Runtime: Node 24+, Package Manager: pnpm 11.9.0
  - UI: React 19, Tailwind CSS v4
  - Database: Drizzle ORM + Turso (libSQL)
  - Testing: Vitest, Playwright
  - Lint/Format: Oxlint, Oxfmt, Prettier
  - Pre-commit: Husky + lint-staged

  ## プロジェクト構造
  - src/app/ — App Router pages/layouts (RSC + Client Components)
  - src/app/page.tsx — Compatibility entry point: redirects `/` to `/answer`
  - src/app/answer/page.tsx — Answer session runner
  - src/app/api/questions/batch/route.ts — Fixed five-question exam retrieval
  - src/app/api/answers/batch/route.ts — Atomic participant-owned answer submission
  - src/app/api/admin/ — Admin session, presentation, and result publication APIs
  - src/app/api/presentation/route.ts — Public staged presentation projection
  - src/components/ — Shared exam UI components
  - src/lib/ — Utilities, participant auth, JEV assessment, and database repositories
  - src/types/ — TypeScript type definitions
  - tests/ — Test suites (unit, e2e)

  ## ドメイン知識
  - 固定された5問（選択式4問・自由記述1問）の試験を提供
  - 参加者が確認した回答一式を Turso に保存し、同じ提出を訂正可能
  - 管理者が明示的に集計したスナップショットをプレゼンテーションと個人結果に利用
  - `/` は `/answer` へ転送し、ホーム統計画面は提供しない

  ## コーディング規約
  - TypeScript strict mode、any 禁止
  - React 関数コンポーネント、明示的な戻り値の型
  - Tailwind CSS v4 でスタイリング
  - サーバーコンポーネント優先、クライアントコンポーネントは "use client" を明示
  - import パスは @/ (src/) エイリアスを使用

# Per-artifact rules
rules:
  proposal:
    - Write in Japanese or English based on request language
    - Include "Purpose", "Requirements" with concrete scenarios
    - Include "Data Model" section when adding/modifying data structures
    - Keep proposals under 1000 words
  tasks:
    - Break tasks into chunks of max 2 hours
    - Each task must have a clear acceptance criterion
    - Prefer small, independent PRs over monolithic changes
  spec:
    - Keep one canonical product specification at openspec/specs/stcirt/spec.md and preserve its R1–R9 requirement identifiers unless an agreed change requires otherwise
    - Give every requirement at least one concrete WHEN/THEN scenario; distinguish observed implementation behavior from agreed requirements and unresolved decisions
    - Reference actual source paths and existing tests where evidence exists; record missing test coverage explicitly and never treat coverage percentage as requirement traceability
    - Do not turn local benchmarks, implementation details, unverified external services, or unresolved operational targets into new guarantees
    - Keep operational procedures, decision history, and data lifecycle guidance in linked docs rather than duplicating them in the product requirements
    - Reference actual TypeScript types and UI component names when the specification describes them
